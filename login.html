<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Martex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <main class="auth-page">
    <div class="auth-card">
      <section class="auth-panel auth-hero-panel">
        <a class="brand" href="index.html">
          <img class="brand-logo" src="images/logo.png" alt="Martex logo" />
        </a>
        <div class="auth-copy">
          <h1>Welcome back to Martex</h1>
          <p>Integer congue sagittis and velna augue egestas magna suscipit purus aliquam</p>
        </div>
        <p class="auth-note">© 2025 Martex. All Rights Reserved</p>
      </section>

      <section class="auth-panel login-form-panel">
        <div class="signup-top">
          <a class="signup-google-btn" href="#">
            <img src="images/google-logo.png" alt="Google logo" />
            <span>Sign in with Google</span>
          </a>
          <div class="signup-divider"><span>Or, sign in with your email</span></div>
        </div>

        <form class="signup-form">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="example@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-input">
              <input id="password" name="password" type="password" placeholder="••••••••" required />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <div class="field forgot-field">
            <a class="forgot-link" href="#">Forgot your password?</a>
          </div>

          <button class="btn create-account" type="submit">Log In</button>
        </form>

        <p class="signup-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </section>
    </div>
  </main>
</body>
</html>
