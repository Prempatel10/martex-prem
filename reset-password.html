<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Martex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="reset-body">
  <div class="reset-wrapper">
    <a href="index.html" class="reset-logo">
      <img src="images/logo-blue.png" alt="Martex" />
    </a>
    
    <div class="reset-card">
      <h1 class="reset-title">Forgot your password?</h1>
      <p class="reset-desc">Enter your email address, if an account exists we'll send you a link to reset your password.</p>
      
      <form class="reset-form">
        <div class="reset-field">
          <input type="email" placeholder="example@example.com" class="reset-input" required />
          <span class="reset-help">This field is required.</span>
        </div>
        
        <button type="submit" class="reset-btn">Reset My Password</button>
      </form>
      
      <a href="login.html" class="reset-link">Never mind, I remembered!</a>
    </div>
  </div>
</body>
</html>
