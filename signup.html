<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Martex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="signup-body">
  <main class="signup-page">
    <div class="signup-card">
      <section class="signup-panel signup-form-panel">
        <div class="signup-top">
          <a class="signup-google-btn" href="#">
            <img src="images/google-logo.png" alt="Google logo" />
            <span>Sign Up with Google</span>
          </a>
          <div class="signup-divider"><span>Or, sign Up with your email</span></div>
        </div>

        <form class="signup-form">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" placeholder="John Doe" required />
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="example@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-input">
              <input id="password" name="password" type="password" placeholder="min 8 characters" required />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <p class="signup-privacy">
            By clicking "Create Account", you agree to our <a href="#">Terms</a> and that you have read our <a href="#">Privacy Policy</a>.
          </p>

          <button class="btn create-account" type="submit">Create Account</button>
        </form>

        <p class="signup-footer">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </section>

      <section class="signup-panel signup-hero-panel">
        <div class="hero-decoration hero-decoration-lg"></div>
        <div class="hero-decoration hero-decoration-sm"></div>
        <span class="eyebrow">START FOR FREE</span>
        <h1>Create an account</h1>
        <p>Integer congue sagittis and velna augue egestas magna suscipit purus aliquam</p>
      </section>
    </div>
  </main>
</body>
</html>
